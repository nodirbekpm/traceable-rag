[project]
name = "anchor"
version = "0.1.0"
description = "Traceable RAG over documents: span-level provenance, versioning, measured accuracy"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nodirbek Eshnazarov" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anchor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Typographic quotes and dashes are matched on purpose: filings are full of them.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
# SQL check-constraint literals are kept on one line so they match the database verbatim.
"migrations/versions/*" = ["E501"]
# HTML and prose fixtures read better on one line.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
